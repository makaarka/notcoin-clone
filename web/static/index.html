<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Coin Клон</title>
<link rel="stylesheet" href="/style.css" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<div class="app">

  <header class="topbar">
    <div class="balance">
      <span class="coin-icon">🪙</span>
      <span id="balance">0</span>
    </div>
  </header>

  <main id="screen-tap" class="screen active">
    <div class="rank">Игрок</div>
    <button id="coin" class="coin-btn" aria-label="Тапнуть">🪙</button>
    <div class="energy-wrap">
      <div class="energy-bar"><div id="energy-fill" class="energy-fill"></div></div>
      <div class="energy-label"><span id="energy-cur">1000</span>/<span id="energy-max">1000</span> ⚡</div>
    </div>
  </main>

  <main id="screen-tasks" class="screen">
    <h2>Задания</h2>
    <div id="tasks-list" class="list"></div>
  </main>

  <main id="screen-friends" class="screen">
    <h2>Друзья</h2>
    <p class="muted">Приглашено: <span id="ref-count">0</span></p>
    <button id="copy-ref" class="primary-btn">Скопировать ссылку-приглашение</button>
  </main>

  <main id="screen-upgrade" class="screen">
    <h2>Прокачка</h2>
    <div class="list">
      <div class="upgrade-card">
        <div class="upgrade-info">
          <span class="upgrade-title">👆 Сила тапа</span>
          <span class="upgrade-desc">Сейчас: +<span id="tap-power-val">1</span> монета за тап</span>
        </div>
        <button id="upgrade-tap-btn" class="task-btn">
          Улучшить (<span id="tap-power-cost">500</span> 🪙)
        </button>
      </div>
      <div class="upgrade-card">
        <div class="upgrade-info">
          <span class="upgrade-title">🤖 Автокликер</span>
          <span class="upgrade-desc">Уровень: <span id="auto-click-val">0</span> · монеты капают сами</span>
        </div>
        <button id="upgrade-auto-btn" class="task-btn">
          Улучшить (<span id="auto-click-cost">2000</span> 🪙)
        </button>
      </div>
      <div class="upgrade-card">
        <div class="upgrade-info">
          <span class="upgrade-title">⚡ Восстановление энергии</span>
          <span class="upgrade-desc">Сейчас: <span id="energy-regen-val">0.33</span> ⚡/сек</span>
        </div>
        <button id="upgrade-energy-btn" class="task-btn">
          Улучшить (<span id="energy-regen-cost">800</span> 🪙)
        </button>
      </div>
    </div>
  </main>

  <main id="screen-leaders" class="screen">
    <h2>Таблица лидеров</h2>
    <div id="leaders-list" class="list"></div>
  </main>

  <nav class="tabbar">
    <button class="tab active" data-screen="screen-tap">🪙<span>Тап</span></button>
    <button class="tab" data-screen="screen-tasks">📋<span>Задания</span></button>
    <button class="tab" data-screen="screen-friends">👥<span>Друзья</span></button>
    <button class="tab" data-screen="screen-leaders">🏆<span>Лидеры</span></button>
    <button class="tab" data-screen="screen-upgrade">🚀<span>Прокачка</span></button>
  </nav>

</div>
<script src="/app.js"></script>
</body>
</html>
